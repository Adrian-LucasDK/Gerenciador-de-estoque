
{% extends "base.html" %}

{% block title %}
    {{ 'Editar' if product.id else 'Novo' }} produto | Estoque Local
{% endblock %}

{% block content %}

<h1>{{ 'Editar' if product.id else 'Novo' }} produto</h1>

<form method="post" class="card card-body">

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Código/SKU *</label>

            <input
                class="form-control"
                type="text"
                name="code"
                value="{{ product.code or '' }}"
                required
            >
        </div>

        <div class="col-md-8">
            <label class="form-label">Nome *</label>

            <input
                class="form-control"
                type="text"
                name="name"
                value="{{ product.name or '' }}"
                required
            >
        </div>

        <div class="col-md-6">
            <label class="form-label">Categoria</label>

            <input
                class="form-control"
                type="text"
                name="category"
                value="{{ product.category or '' }}"
            >
        </div>

        <div class="col-md-3">
            <label class="form-label">Unidade</label>

            <input
                class="form-control"
                type="text"
                name="unit"
                value="{{ product.unit or 'un' }}"
            >
        </div>

        <div class="col-md-3">
            <label class="form-label">Estoque mínimo</label>

            <input
                class="form-control"
                type="number"
                min="0"
                step="1"
                name="minimum"
                value="{{ product.minimum or 0 }}"
            >
        </div>

        <div class="col-md-4">
            <label class="form-label">Custo unitário (R$)</label>

            <input
                class="form-control"
                type="number"
                min="0"
                step="0.01"
                name="cost"
                value="{{ product.cost or 0 }}"
            >
        </div>

        <div class="col-md-8">
            <label class="form-label">Fornecedor</label>

            <select class="form-select" name="supplier_id">

                <option value="">Não informado</option>

                {% for s in suppliers %}
                    <option
                        value="{{ s.id }}"
                        {% if product.supplier_id == s.id %}
                            selected
                        {% endif %}
                    >
                        {{ s.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="col-12">
            <label class="form-label">Descrição</label>

            <textarea
                class="form-control"
                name="description"
                rows="3"
            >{{ product.description or '' }}</textarea>
        </div>

    </div>

    <p class="text-muted small mt-3">
        O saldo é alterado pela tela de movimentações,
        para manter o histórico correto.
    </p>

    <div class="mt-3">

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a class="btn btn-secondary" href="{{ url_for('products') }}">
            Cancelar
        </a>

    </div>

</form>

{% endblock %}
