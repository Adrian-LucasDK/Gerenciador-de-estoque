
{% extends "base.html" %}

{% block content %}

<div class="login-card card shadow-sm">
    <div class="card-body p-4">

        <h2>Alterar senha</h2>

        <form method="post">

            <label class="form-label">
                Senha atual
            </label>

            <input
                class="form-control mb-3"
                type="password"
                name="current_password"
                required
            >

            <label class="form-label">
                Nova senha
            </label>

            <input
                class="form-control mb-3"
                type="password"
                name="new_password"
                minlength="8"
                required
            >

            <label class="form-label">
                Confirmar nova senha
            </label>

            <input
                class="form-control mb-3"
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit" class="btn btn-primary">
                Atualizar senha
            </button>

        </form>

    </div>
</div>

{% endblock %}
