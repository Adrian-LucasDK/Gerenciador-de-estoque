
{% extends "base.html" %}

{% block title %}Login | Estoque Local{% endblock %}

{% block content %}

<div class="login-card card shadow-sm">
    <div class="card-body p-4">

        <h2 class="mb-3">Acessar sistema</h2>

        <form method="post">

            <label class="form-label">
                Usuário
            </label>

            <input
                class="form-control mb-3"
                type="text"
                name="username"
                required
                autofocus
            >

            <label class="form-label">
                Senha
            </label>

            <input
                class="form-control mb-3"
                type="password"
                name="password"
                required
            >

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

    </div>
</div>

{% endblock %}
